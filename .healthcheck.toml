# Tenet Configuration
# Generated by tenet-toolchain-setup v1.0.0 (written non-interactively for the 2026-10-21 overnight review)
# Date: 2026-10-21T02:40:00Z

[project]
slug = "ithaca"
name = "Ithaca"
repo_url = "git@github.com:inceptyon-labs/ithaca.git"

[toolchain]
# "auto"     = run if installed, skip silently if not
# "required" = fail the toolchain run if this tool is missing
# "off"      = never run, even if installed

# ── Secrets ────────────────────────────────────────────────────────────────
gitleaks    = "required"
semgrep     = "auto"
trufflehog  = "auto"

# ── Dependency scanning ────────────────────────────────────────────────────
# Native/IthacaDovi/Cargo.lock is the only lockfile. VLCKit is a pinned binary
# download (ci_scripts/install_vlckit.sh), not a package manager dependency.
trivy       = "auto"
osv_scanner = "auto"
syft        = "auto"
grype       = "auto"
npm_audit   = "off"     # no package.json
pip_audit   = "off"     # no Python source

# ── Swift linting / formatting ─────────────────────────────────────────────
# No .swiftlint.yml / .swiftformat in the repo; tools run with defaults.
swiftlint   = "auto"
swiftformat = "auto"

# ── Docs ───────────────────────────────────────────────────────────────────
markdownlint = "auto"

# ── Not applicable for this project ───────────────────────────────────────
eslint      = "off"     # no JS/TS
radon       = "off"     # no Python
gocyclo     = "off"     # no Go
hadolint    = "off"     # no Dockerfile
actionlint  = "off"     # no .github/workflows (Xcode Cloud via ci_scripts/)
axe         = "off"     # no web UI
pa11y       = "off"     # no web UI
tflint      = "off"     # no Terraform
checkov     = "off"
tfsec       = "off"
kube_linter = "off"
conftest    = "off"

[models]
judge  = "fable"    # correctness, security, solid, api-contract, privacy-data, errors, performance
worker = "sonnet"   # complexity, dependencies, debt, testing, docs, accessibility, secrets,
                    # observability, build-ci, supply-chain-license, infra-cloud,
                    # database-migrations, release-ops, toolchain

[weights]
security = 1.5
secrets = 1.5
correctness = 1.3
privacy-data = 1.3
dependencies = 1.3
errors = 1.3
supply-chain-license = 1.2
infra-cloud = 1.2
solid = 1.1
complexity = 1.1
debt = 1.1
testing = 1.1
database-migrations = 1.1
performance = 1.0
api-contract = 1.0
observability = 1.0
build-ci = 1.0
release-ops = 1.0
docs = 0.8
accessibility = 0.8

[dimensions]

[suppressions]

[testing.mutation]
mode = "informational"
minimum_score = 70
excellent_score = 85
bonus_points = 2
scope = "changed_files"
report_paths = [
  ".healthcheck/mutation/mutation-testing.json",
  ".healthcheck/mutation/muter.json",
  "mutation-report.json",
  "reports/mutation-testing.json"
]
